services:
  postgres:
    image: mdillon/postgis:9.6
    restart: always
    ports:
      - "5555:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: engineTest888
      POSTGRES_DB: portfolio
    volumes:
      - ./database/:/docker-entrypoint-initdb.d/
      - pg-data:/var/lib/postgresql/data
  
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_USER: postgres
      DB_PASSWORD: engineTest888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: portfolio
    ports:
      - "3000:3000"
    depends_on:
      - postgres
volumes:
  pg-data:
